<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Art Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <!-- Tiêu đề: ảnh PNG trong suốt của bạn (title.png).
         Muốn đổi kích thước: sửa --title-width trong style.css -->
    <img class="title-img" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEicBeYOt2OEomomrWawDlRTIbaebKq7ZS7hwS8j1NGosQPj__uLXsQous5xzd9z54qOUEGvPFL0BbQ80nIPzU_KbQM-unGqWC5vaoY-yZoZrsPkJUvKLylPQxpaIQS2JCPtZkXqLzgG1q_dEjUdKxMYolDDKTkPrM0nAOKJTNpXZOzEjGXNPJKQhPtM4z0/s1600/howl_s_moving_castle-removebg-preview.png" alt="Art Room">

    <nav class="tabs">
      <button class="tab" id="tab-drawings" data-target="drawings">drawings</button>
      <button class="tab active" id="tab-zine" data-target="zine">zine</button>
    </nav>
  </header>

  <main class="room">

    <!-- ========== DRAWINGS ========== -->
    <section id="drawings" class="panel">
      <div id="gallery" class="gallery"></div>
      <p id="gallery-msg" class="soon"></p>
    </section>

    <!-- ========== ZINE ========== -->
    <section id="zine" class="panel active">
      <div class="shelf">

        <!-- Mỗi zine là một thẻ <a> như dưới đây.
             Muốn thêm zine mới: copy nguyên thẻ <a>...</a>, dán bên cạnh,
             rồi đổi mã zine (d1522d9acc) ở cả href lẫn src của ảnh bìa. -->
        <a href="https://heyzine.com/flip-book/d1522d9acc.html"
           target="_BLANK"
           class="heyzine-link fp-link"
           data-heyzine-open="modal">
          <img src="https://cdnm.heyzine.com/flip-book/cover/d1522d9acc.jpg"
               class="fp-thumb" alt="zine">
        </a>

      </div>
    </section>

  </main>

  <!-- Xem ảnh phóng to -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-btn lb-close" aria-label="Đóng">×</button>
    <button class="lb-btn lb-prev" aria-label="Ảnh trước">‹</button>
    <img class="lb-img" alt="">
    <button class="lb-btn lb-next" aria-label="Ảnh sau">›</button>
  </div>

  <!-- Script của Heyzine để mở zine dạng pop-up -->
  <script src="https://cdnm.heyzine.com/release/addons.7.min.js" style="display:none;" onload="heyzinea.addons.init();"></script>
  <script src="script.js"></script>
</body>
</html>
