<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Art Room</title>
  <!-- Font Yuji Mai (Google Fonts) cho tên các mục -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="layout">

    <!-- ========== CỘT TRÁI: tiêu đề + mục ========== -->
    <aside class="side">
      <!-- Tiêu đề: ảnh title.png của bạn (nếu chưa upload thì tự ẩn đi).
           Đổi kích thước: sửa --title-width trong style.css -->
      <img class="title-img" src="title.png" alt="Art Room" onerror="this.style.display='none'">

      <!-- Ảnh PNG thêm vào phần tiêu đề.
           Đổi kích thước: sửa --deco-width trong style.css -->
      <img class="title-deco"
           src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj6LsY8s0zmtE2CUdKoYxwA9b1PR0AJmrzhYMgeeDUqty1d1vdzD1GDiKjhYZayQyw3h1j3N-Nbx0HFxyon-FYqGJs7GqP-3kOqy4gZm3D22iXlyjpVEdRlkm3IU844qOMGLlKfzcDx7WsB4BqaaTSZDYJGCUj0zo95QKcMQ9d3-kF3Ro5m1cdyy8zAiRE/s1600/sold_these_two_beauties___i_love_the_way_they_came_out_and_i_definitely_want_to_make_more____sun__moon__sunandmoon__celestial__upcycled__applique__freeformsewing__1920s-removebg-preview.png"
           alt="">

      <nav class="tabs">
        <button class="tab" id="tab-drawings" data-target="drawings">drawings</button>
        <button class="tab active" id="tab-zine" data-target="zine">poetry zine</button>
      </nav>
    </aside>

    <!-- ========== CỘT PHẢI: nội dung ========== -->
    <main class="content">

      <!-- DRAWINGS -->
      <section id="drawings" class="panel">
        <div id="gallery" class="gallery"></div>
        <p id="gallery-msg" class="soon"></p>
      </section>

      <!-- ZINE -->
      <section id="zine" class="panel active">
        <div class="shelf">

          <!-- Mỗi zine là một thẻ <a> như dưới đây.
               Muốn thêm zine mới: copy nguyên thẻ <a>...</a>, dán bên cạnh,
               rồi đổi mã zine (d1522d9acc) ở cả href lẫn src của ảnh bìa. -->
          <a href="https://heyzine.com/flip-book/d1522d9acc.html"
             target="_BLANK"
             class="heyzine-link fp-link"
             data-heyzine-open="modal">
            <img src="https://cdnm.heyzine.com/flip-book/cover/d1522d9acc.jpg"
                 class="fp-thumb" alt="zine">
          </a>

        </div>
      </section>

    </main>
  </div>

  <!-- Xem ảnh phóng to -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-btn lb-close" aria-label="Đóng">×</button>
    <button class="lb-btn lb-prev" aria-label="Ảnh trước">‹</button>
    <img class="lb-img" alt="">
    <button class="lb-btn lb-next" aria-label="Ảnh sau">›</button>
  </div>

  <!-- Script của Heyzine để mở zine dạng pop-up -->
  <script src="https://cdnm.heyzine.com/release/addons.7.min.js" style="display:none;" onload="heyzinea.addons.init();"></script>
  <script src="script.js"></script>
</body>
</html>
