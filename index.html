<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Art Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <!-- Tiêu đề: ảnh PNG trong suốt của bạn.
         Upload ảnh vào repo với tên title.png (hoặc đổi tên ở src bên dưới).
         Muốn đổi kích thước: sửa --title-width trong style.css -->
    <img class="title-img" src="title.png" alt="Art Room">

    <nav class="tabs">
      <button class="tab" id="tab-drawings" data-target="drawings">drawings</button>
      <button class="tab active" id="tab-zine" data-target="zine">zine</button>
    </nav>
  </header>

  <main class="room">

    <!-- ========== DRAWINGS ========== -->
    <section id="drawings" class="panel">
      <p class="soon">đang cập nhật...</p>
    </section>

    <!-- ========== ZINE ========== -->
    <section id="zine" class="panel active">
      <div class="shelf">

        <!-- Mỗi zine là một thẻ <a> như dưới đây.
             Muốn thêm zine mới: copy nguyên thẻ <a>...</a>, dán bên cạnh,
             rồi đổi mã zine (d1522d9acc) ở cả href lẫn src của ảnh bìa. -->
        <a href="https://heyzine.com/flip-book/d1522d9acc.html"
           target="_BLANK"
           class="heyzine-link fp-link"
           data-heyzine-open="modal">
          <img src="https://cdnm.heyzine.com/flip-book/cover/d1522d9acc.jpg"
               class="fp-thumb" alt="zine">
        </a>

      </div>
    </section>

  </main>

  <!-- Script của Heyzine để mở zine dạng pop-up -->
  <script src="https://cdnm.heyzine.com/release/addons.7.min.js" style="display:none;" onload="heyzinea.addons.init();"></script>
  <script src="script.js"></script>
</body>
</html>
